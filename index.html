<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      color: black;
    }

    h1 {
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 32px;
    }

    .totals {
      display: flex;
      gap: 32px;
      margin: 20px 0;
    }

    .total {
      font-size: 24px;
      font-weight: bold;
    }

    .total-label {
      display: block;
      font-size: 14px;
      font-weight: normal;
      margin-bottom: 4px;
    }

    form {
      display: grid;
      gap: 12px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
    }

    button {
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }

    .filter {
      margin-bottom: 16px;
    }

    .expense {
      padding: 16px 0;
      border-bottom: 1px solid #ddd;
    }

    .expense-amount {
      font-size: 20px;
      font-weight: bold;
    }

    .expense-details {
      margin-top: 6px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Expense Tracker</h1>

  <div class="totals">
    <div class="total">
      <span class="total-label">All-time total</span>
      $<span id="total">0.00</span>
    </div>

    <div class="total">
      <span class="total-label">This month</span>
      $<span id="month-total">0.00</span>
    </div>
  </div>

  <form id="expense-form">
    <input type="number" id="amount" placeholder="Amount">

    <select id="payment-method">
      <option>Cash</option>
      <option>Octopus</option>
      <option>Alipay</option>
      <option>Mastercard</option>
      <option>Visa</option>
      <option>Other</option>
    </select>

    <select id="category">
      <option>Food</option>
      <option>Transport</option>
      <option>Shopping</option>
      <option>Bills</option>
      <option>Fun</option>
      <option>Other</option>
    </select>

    <input type="text" id="note" placeholder="Note (optional)">

    <button type="submit">Add expense</button>
  </form>

  <h2>Expenses</h2>

  <div class="filter">
    <select id="payment-filter">
      <option>All methods</option>
      <option>Cash</option>
      <option>Octopus</option>
      <option>Alipay</option>
      <option>Mastercard</option>
      <option>Visa</option>
      <option>Other</option>
    </select>
  </div>

  <div id="expense-list"></div>

  <script>
    const STORAGE_KEY = "expenseTracker.v1";

    // Load saved expenses, or start with an empty list.
    let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const form = document.getElementById("expense-form");
    const amountInput = document.getElementById("amount");
    const paymentInput = document.getElementById("payment-method");
    const categoryInput = document.getElementById("category");
    const noteInput = document.getElementById("note");
    const paymentFilter = document.getElementById("payment-filter");
    const expenseList = document.getElementById("expense-list");
    const totalElement = document.getElementById("total");
    const monthTotalElement = document.getElementById("month-total");

    // Get today's date using the local timezone.
    function getLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    // Display expenses and update both totals.
    function renderExpenses() {
      expenseList.innerHTML = "";

      let total = 0;
      let monthTotal = 0;

      const today = new Date();
      const currentYear = today.getFullYear();
      const currentMonth = String(today.getMonth() + 1).padStart(2, "0");

      const selectedMethod = paymentFilter.value;

      expenses.forEach(expense => {
        const amount = Number(expense.amount);

        total += amount;

        // Calculate this month's total from all expenses.
        if (
          expense.date.startsWith(`${currentYear}-${currentMonth}`)
        ) {
          monthTotal += amount;
        }
      });

      // Filter only the rows shown in the list.
      const filteredExpenses = expenses.filter(expense => {
        return (
          selectedMethod === "All methods" ||
          expense.paymentMethod === selectedMethod
        );
      });

      filteredExpenses.forEach(expense => {
        const expenseElement = document.createElement("div");
        expenseElement.className = "expense";

        expenseElement.innerHTML = `
          <div class="expense-amount">$${Number(expense.amount).toFixed(2)}</div>
          <div class="expense-details">
            ${expense.date} · ${expense.paymentMethod} · ${expense.category}
            ${expense.note ? ` · ${expense.note}` : ""}
          </div>
        `;

        expenseList.appendChild(expenseElement);
      });

      totalElement.textContent = total.toFixed(2);
      monthTotalElement.textContent = monthTotal.toFixed(2);
    }

    // Add a new expense.
    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const expense = {
        amount: amountInput.value,
        paymentMethod: paymentInput.value,
        category: categoryInput.value,
        note: noteInput.value,
        date: getLocalDate()
      };

      expenses.unshift(expense);

      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));

      form.reset();
      renderExpenses();
    });

    // Change which expenses are shown.
    paymentFilter.addEventListener("change", renderExpenses);

    // Show saved expenses when the page opens.
    renderExpenses();
  </script>

</body>
</html>
