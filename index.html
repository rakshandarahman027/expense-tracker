</head>

<body>

  <h1>Rakshanda's Budget</h1>

  <nav class="tabs">
    <button class="tab-button active" data-tab="add-tab" type="button">Add</button>
    <button class="tab-button" data-tab="calendar-tab" type="button">Calendar</button>
    <button class="tab-button" data-tab="history-tab" type="button">History</button>
  </nav>

  <!-- ADD TAB -->
  <section id="add-tab" class="tab-content active">

    <div class="totals">
      <div class="total">
        <span class="total-label">All-time total</span>
        $<span id="total">0.00</span>
      </div>

      <div class="total">
        <span class="total-label">This month</span>
        $<span id="month-total">0.00</span>
      </div>
    </div>

    <div class="budget">
      <div class="budget-input">
        <label for="budget-input">Monthly budget</label>
        <input type="number" id="budget-input" placeholder="e.g. 2500" min="0">
      </div>

      <h2 id="add-budget-title">Budget for October 2026</h2>

      <div class="budget-line">
        Spent: $<span id="add-budget-spent">0.00</span>
      </div>

      <div class="budget-line">
        Budget: $<span id="add-budget-amount">0.00</span>
      </div>

      <div id="add-budget-left-line" class="budget-line budget-left under-budget">
        Left: $<span id="add-budget-left">0.00</span>
      </div>
    </div>

    <form id="expense-form">
      <input type="date" id="date">

      <input type="number" id="amount" placeholder="Amount">

      <select id="payment-method">
        <option>Cash</option>
        <option>Octopus</option>
        <option>Alipay</option>
        <option>Mastercard</option>
        <option>Visa</option>
        <option>Other</option>
      </select>

      <select id="category">
        <option>Food</option>
        <option>Transport</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Fun</option>
        <option>Other</option>
      </select>

      <input type="text" id="note" placeholder="Note (optional)">

      <button type="submit">Add expense</button>

      <p id="error-message" class="error"></p>
    </form>

  </section>

  <!-- CALENDAR TAB -->
  <section id="calendar-tab" class="tab-content">

    <div class="calendar">
      <div class="calendar-header">
        <button id="previous-month" class="calendar-nav" type="button">◀</button>
        <h2 id="calendar-title"></h2>
        <button id="next-month" class="calendar-nav" type="button">▶</button>
      </div>

      <div class="calendar-grid" id="calendar"></div>
    </div>

    <div class="budget">
      <h2 id="calendar-budget-title">Budget for October 2026</h2>

      <div class="budget-line">
        Spent: $<span id="calendar-budget-spent">0.00</span>
      </div>

      <div class="budget-line">
        Budget: $<span id="calendar-budget-amount">0.00</span>
      </div>

      <div id="calendar-budget-left-line" class="budget-line budget-left under-budget">
        Left: $<span id="calendar-budget-left">0.00</span>
      </div>
    </div>

  </section>

  <!-- HISTORY TAB -->
  <section id="history-tab" class="tab-content">

    <div class="filter">
      <select id="payment-filter">
        <option>All methods</option>
        <option>Cash</option>
        <option>Octopus</option>
        <option>Alipay</option>
        <option>Mastercard</option>
        <option>Visa</option>
        <option>Other</option>
      </select>

      <select id="category-filter">
        <option>All categories</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Fun</option>
        <option>Other</option>
      </select>
    </div>

    <h2>Summary by payment method</h2>
    <div id="summary" class="summary"></div>

    <h2>Expenses</h2>
    <div id="expense-list"></div>

    <button id="clear-all" class="clear-button">Clear all</button>

  </section>

  <script>
    const STORAGE_KEY = "expenseTracker.v1";
    const BUDGET_KEY = "expenseTracker.budget";

    // Load saved expenses and remove invalid old entries.
    let savedExpenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    let expenses = savedExpenses.filter(expense => {
      return Number.isFinite(Number(expense.amount)) && Number(expense.amount) > 0;
    });

    // Load the saved monthly budget.
    let budget = Number(localStorage.getItem(BUDGET_KEY)) || 0;

    const form = document.getElementById("expense-form");
    const dateInput = document.getElementById("date");
    const amountInput = document.getElementById("amount");
    const paymentInput = document.getElementById("payment-method");
    const categoryInput = document.getElementById("category");
    const noteInput = document.getElementById("note");
    const paymentFilter = document.getElementById("payment-filter");
    const categoryFilter = document.getElementById("category-filter");
    const expenseList = document.getElementById("expense-list");
    const totalElement = document.getElementById("total");
    const monthTotalElement = document.getElementById("month-total");
    const errorMessage = document.getElementById("error-message");
    const summaryElement = document.getElementById("summary");
    const clearAllButton = document.getElementById("clear-all");
    const calendarElement = document.getElementById("calendar");
    const calendarTitle = document.getElementById("calendar-title");
    const previousMonthButton = document.getElementById("previous-month");
    const nextMonthButton = document.getElementById("next-month");
    const budgetInput = document.getElementById("budget-input");

    // Get today's date using local time.
    function getLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    dateInput.value = getLocalDate();
    budgetInput.value = budget || "";

    // The calendar starts on the current local month.
    let calendarDate = new Date();
    calendarDate.setDate(1);

    // Get a readable month and year.
    function getMonthTitle(date) {
      return date.toLocaleString("en-US", {
        month: "long",
        year: "numeric"
      });
    }

    // Get total spending for a specific month.
    function getMonthSpent(year, month) {
      const monthString = String(month + 1).padStart(2, "0");

      return expenses
        .filter(expense => {
          return expense.date.startsWith(`${year}-${monthString}`);
        })
        .reduce((total, expense) => total + Number(expense.amount), 0);
    }

    // Update budget information for the currently viewed calendar month.
    function renderBudget() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      const title = getMonthTitle(calendarDate);
      const spent = getMonthSpent(year, month);
      const difference = budget - spent;

      const budgetData = [
        {
          title: document.getElementById("add-budget-title"),
          spent: document.getElementById("add-budget-spent"),
          amount: document.getElementById("add-budget-amount"),
          leftLine: document.getElementById("add-budget-left-line")
        },
        {
          title: document.getElementById("calendar-budget-title"),
          spent: document.getElementById("calendar-budget-spent"),
          amount: document.getElementById("calendar-budget-amount"),
          leftLine: document.getElementById("calendar-budget-left-line")
        }
      ];

      budgetData.forEach(section => {
        section.title.textContent = `Budget for ${title}`;
        section.spent.textContent = spent.toFixed(2);
        section.amount.textContent = budget.toFixed(2);

        if (difference >= 0) {
          section.leftLine.className =
            "budget-line budget-left under-budget";
          section.leftLine.innerHTML =
            `Left: $${difference.toFixed(2)}`;
        } else {
          section.leftLine.className =
            "budget-line budget-left over-budget";
          section.leftLine.innerHTML =
            `Over by $${Math.abs(difference).toFixed(2)}`;
        }
      });
    }

    // Build the calendar.
    function renderCalendar() {
      calendarElement.innerHTML = "";

      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();

      calendarTitle.textContent = getMonthTitle(calendarDate);

      const weekdays = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      weekdays.forEach(day => {
        const weekdayElement = document.createElement("div");
        weekdayElement.className = "weekday";
        weekdayElement.textContent = day;
        calendarElement.appendChild(weekdayElement);
      });

      // Convert JavaScript's Sunday = 0 into Monday = 0.
      const firstDay = new Date(year, month, 1).getDay();
      const firstDayOffset = (firstDay + 6) % 7;

      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Empty cells before the first day.
      for (let i = 0; i < firstDayOffset; i++) {
        const emptyDay = document.createElement("div");
        emptyDay.className = "empty-day";
        calendarElement.appendChild(emptyDay);
      }

      // Day cells.
      for (let day = 1; day <= daysInMonth; day++) {
        const dayElement = document.createElement("div");
        dayElement.className = "day";

        const dayNumber = document.createElement("div");
        dayNumber.className = "day-number";
        dayNumber.textContent = day;

        dayElement.appendChild(dayNumber);

        const date = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

        const today = getLocalDate();

        if (date === today) {
          dayElement.classList.add("today");
        }

        const dayTotal = expenses
          .filter(expense => expense.date === date)
          .reduce((total, expense) => total + Number(expense.amount), 0);

        if (dayTotal > 0) {
          const badge = document.createElement("div");
          badge.className = "day-badge";

          if (dayTotal > 100) {
            badge.classList.add("high");
          }

          badge.textContent = `$${dayTotal.toFixed(2)}`;
          dayElement.appendChild(badge);
        }

        calendarElement.appendChild(dayElement);
      }
    }

    // Move the calendar backward one month.
    previousMonthButton.addEventListener("click", function() {
      calendarDate.setMonth(calendarDate.getMonth() - 1);
      renderCalendar();
      renderBudget();
    });

    // Move the calendar forward one month.
    nextMonthButton.addEventListener("click", function() {
      calendarDate.setMonth(calendarDate.getMonth() + 1);
      renderCalendar();
      renderBudget();
    });

    // Update totals, summary, and history.
    function renderExpenses() {
      expenseList.innerHTML = "";

      let total = 0;
      let monthTotal = 0;
      const paymentTotals = {};

      const today = new Date();
      const currentYear = today.getFullYear();
      const currentMonth = String(today.getMonth() + 1).padStart(2, "0");

      const selectedPayment = paymentFilter.value;
      const selectedCategory = categoryFilter.value;

      expenses.forEach(expense => {
        const amount = Number(expense.amount);

        total += amount;

        if (expense.date.startsWith(`${currentYear}-${currentMonth}`)) {
          monthTotal += amount;
        }

        if (!paymentTotals[expense.paymentMethod]) {
          paymentTotals[expense.paymentMethod] = 0;
        }

        paymentTotals[expense.paymentMethod] += amount;
      });

      // Summary always uses all expenses.
      const sortedPayments = Object.entries(paymentTotals)
        .sort((a, b) => b[1] - a[1]);

      if (sortedPayments.length === 0) {
        summaryElement.innerHTML = "<p>No expenses yet</p>";
      } else {
        summaryElement.innerHTML = "";

        sortedPayments.forEach(([method, amount]) => {
          const summaryItem = document.createElement("div");
          summaryItem.className = "summary-item";

          summaryItem.innerHTML = `
            <span>${method}</span>
            <strong>$${amount.toFixed(2)}</strong>
          `;

          summaryElement.appendChild(summaryItem);
        });
      }

      // Filters only affect which rows are shown.
      const filteredExpenses = expenses.filter(expense => {
        const paymentMatches =
          selectedPayment === "All methods" ||
          expense.paymentMethod === selectedPayment;

        const categoryMatches =
          selectedCategory === "All categories" ||
          expense.category === selectedCategory;

        return paymentMatches && categoryMatches;
      });

      filteredExpenses.forEach(expense => {
        const expenseElement = document.createElement("div");
        expenseElement.className = "expense";

        const expenseInfo = document.createElement("div");
        expenseInfo.className = "expense-info";

        expenseInfo.innerHTML = `
          <div class="expense-amount">
            $${Number(expense.amount).toFixed(2)}
          </div>
          <div class="expense-details">
            ${expense.date} · ${expense.paymentMethod} · ${expense.category}
            ${expense.note ? ` · ${expense.note}` : ""}
          </div>
        `;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "✕";
        deleteButton.setAttribute("aria-label", "Delete expense");

        deleteButton.addEventListener("click", function() {
          const confirmed = confirm("Delete this expense?");

          if (confirmed) {
            const expenseIndex = expenses.indexOf(expense);

            if (expenseIndex !== -1) {
              expenses.splice(expenseIndex, 1);
              localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(expenses)
              );

              renderExpenses();
            }
          }
        });

        expenseElement.appendChild(expenseInfo);
        expenseElement.appendChild(deleteButton);
        expenseList.appendChild(expenseElement);
      });

      totalElement.textContent = total.toFixed(2);
      monthTotalElement.textContent = monthTotal.toFixed(2);

      // Rebuild everything so hidden tabs have current data.
      renderCalendar();
      renderBudget();
    }

    // Add a new expense.
    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const amount = Number(amountInput.value);

      if (
        !amountInput.value ||
        !Number.isFinite(amount) ||
        amount <= 0
      ) {
        errorMessage.textContent =
          "Please enter an amount greater than 0";
        return;
      }

      const expense = {
        amount: amountInput.value,
        paymentMethod: paymentInput.value,
        category: categoryInput.value,
        note: noteInput.value,
        date: dateInput.value
      };

      expenses.unshift(expense);

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(expenses)
      );

      form.reset();

      dateInput.value = getLocalDate();
      errorMessage.textContent = "";

      renderExpenses();
    });

    // Change payment filter.
    paymentFilter.addEventListener("change", renderExpenses);

    // Change category filter.
    categoryFilter.addEventListener("change", renderExpenses);

    // Save the monthly budget whenever it changes.
    budgetInput.addEventListener("input", function() {
      const value = Number(budgetInput.value);

      if (
        budgetInput.value === "" ||
        !Number.isFinite(value) ||
        value < 0
      ) {
        budget = 0;
      } else {
        budget = value;
      }

      localStorage.setItem(BUDGET_KEY, budget);
      renderBudget();
    });

    // Clear all expenses after confirmation.
    clearAllButton.addEventListener("click", function() {
      const confirmed = confirm(
        "Are you sure you want to clear all expenses?"
      );

      if (confirmed) {
        expenses = [];
        localStorage.removeItem(STORAGE_KEY);
        renderExpenses();
      }
    });

    // Switch between tabs.
    document.querySelectorAll(".tab-button").forEach(button => {
      button.addEventListener("click", function() {
        const tabId = button.dataset.tab;

        document.querySelectorAll(".tab-button").forEach(tabButton => {
          tabButton.classList.remove("active");
        });

        document.querySelectorAll(".tab-content").forEach(tab => {
          tab.classList.remove("active");
        });

        button.classList.add("active");
        document.getElementById(tabId).classList.add("active");
      });
    });
