
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rakshanda's Budget</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #8fb3c0;
      color: #2b2b2b;
    }

    .app-card {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
      background: #fdfaf2;
      border-radius: 16px;
      box-shadow:
        0 8px 28px rgba(48, 67, 73, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    h1 {
      position: relative;
      margin: 0 0 28px;
      padding: 18px 18px 14px 52px;
      font-size: 32px;
      color: #6b4f2c;
      background: linear-gradient(
        90deg,
        #e5ecd9 0%,
        #f2ead8 55%,
        rgba(242, 234, 216, 0.35) 100%
      );
      border-radius: 12px;
      border-bottom: 3px solid #a68963;
      overflow: visible;
    }

    /* Small decorative leaf/tree symbol */
    h1::before {
      content: "❧";
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-53%);
      font-size: 25px;
      color: #8ba888;
      line-height: 1;
    }

    h1::after {
      content: "•  •  •";
      position: absolute;
      left: 50%;
      bottom: -23px;
      transform: translateX(-50%);
      color: #a3b899;
      font-size: 11px;
      letter-spacing: 2px;
      white-space: nowrap;
      background: #fdfaf2;
      padding: 0 10px;
    }

    h2 {
      margin-top: 32px;
      color: #3f6b4d;
    }

    .tabs {
      position: relative;
      display: flex;
      border-bottom: 1px solid #e0d8c8;
      margin-bottom: 24px;
    }

    .tab-button {
      flex: 1;
      background: transparent;
      color: #777;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 12px 8px;
      font-size: 16px;
      font-weight: normal;
      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .tab-button:hover {
      background: #eef3e9;
      color: #5d765c;
    }

    .tab-button.active {
      color: #8ba888;
      font-weight: bold;
      border-bottom-color: #8ba888;
      background: transparent;
    }

    .tab-button.active:hover {
      background: transparent;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .totals {
      display: flex;
      gap: 16px;
      margin: 20px 0;
    }

    .total {
      flex: 1;
      padding: 18px;
      background: #f7f3eb;
      border: 1px solid #a68963;
      border-radius: 10px;
      font-size: 24px;
      font-weight: bold;
    }

    .total:first-child {
      background: #eef3e9;
      border-color: #a3b899;
    }

    .total:last-child {
      background: #f5ead8;
      border-color: #a68963;
    }

    .total-label {
      display: block;
      font-size: 14px;
      font-weight: normal;
      margin-bottom: 4px;
      color: #5a564f;
    }

    form {
      display: grid;
      gap: 12px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
    }

    input,
    select {
      background: #fdfaf2;
      color: #2b2b2b;
      border: 1px solid #a68963;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #8ba888;
      box-shadow: 0 0 0 2px rgba(139, 168, 136, 0.18);
    }

    button {
      background: #a68963;
      color: #fffaf0;
      border: none;
      cursor: pointer;
      transition:
        filter 0.2s ease,
        background 0.2s ease;
    }

    button:hover {
      filter: brightness(0.94);
    }

    .error {
      color: #b85c38;
      font-size: 14px;
      margin: 0;
    }

    .budget {
      position: relative;
      margin-top: 20px;
      padding: 16px;
      background: #f7f3eb;
      border: 1px solid #e0d8c8;
      border-left: 4px solid #8ba888;
      border-radius: 10px;
    }

    .budget::before {
      content: "●";
      position: absolute;
      left: 15px;
      top: 15px;
      color: #a3b899;
      font-size: 9px;
    }

    .budget h2 {
      margin: 0 0 12px;
      padding-left: 15px;
      font-size: 20px;
      color: #3f6b4d;
    }

    .budget-input {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .budget-input label {
      font-size: 14px;
      white-space: nowrap;
    }

    .budget-input label::before {
      content: "●";
      color: #a3b899;
      font-size: 9px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .budget-input input {
      max-width: 180px;
    }

    .budget-line {
      margin: 6px 0;
    }

    .budget-left {
      font-weight: bold;
    }

    .under-budget {
      color: #3f6b4d;
    }

    .over-budget {
      color: #b85c38;
    }

    .calendar {
      margin-top: 20px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }

    .calendar-header h2 {
      margin: 0;
      font-size: 22px;
      font-weight: bold;
      color: #3f6b4d;
    }

    .calendar-nav {
      width: auto;
      padding: 8px 14px;
      font-size: 18px;
      background: #a68963;
      color: #fffaf0;
      border-radius: 8px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 4px;
      background: #f7f3eb;
      border-radius: 10px;
    }

    .weekday {
      text-align: center;
      font-weight: bold;
      font-size: 13px;
      padding: 8px 2px;
      color: #8ba888;
    }

    .day {
      min-height: 70px;
      border: 1px solid #d6c9b6;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      overflow: hidden;
      background: #fffdf8;
      border-radius: 6px;
    }

    .day-number {
      font-weight: bold;
      font-size: 14px;
      color: #2b2b2b;
    }

    .day-badge {
      font-size: 11px;
      background: #8ba888;
      color: #fffaf0;
      padding: 3px 5px;
      border-radius: 4px;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-badge.high {
      background: #b85c38;
      color: #fffaf0;
      font-weight: bold;
    }

    .empty-day {
      min-height: 70px;
      background: transparent;
    }

    .summary {
      padding: 16px 0;
    }

    .summary-item {
      padding: 10px 12px;
      border-bottom: 1px solid #e0d8c8;
      display: flex;
      justify-content: space-between;
      background: #fffdf8;
    }

    .summary-item:nth-child(even) {
      background: #f5ead8;
    }

    .filter {
      margin-bottom: 16px;
      display: grid;
      gap: 10px;
    }

    .filter select {
      margin-bottom: 0;
    }

    .expense {
      padding: 16px 12px;
      border-bottom: 1px solid #e0d8c8;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      background: #fffdf8;
    }

    .expense:nth-child(even) {
      background: #f5ead8;
    }

    .expense-info {
      flex: 1;
      min-width: 0;
    }

    .expense-amount {
      font-size: 20px;
      font-weight: bold;
      color: #2b2b2b;
    }

    .expense-details {
      margin-top: 6px;
      color: #655f56;
      font-size: 14px;
    }

    .delete-button {
      width: auto;
      padding: 4px 8px;
      background: transparent;
      color: #8b765d;
      border: 1px solid #a68963;
      font-size: 14px;
      flex-shrink: 0;
    }

    .delete-button:hover {
      background: #fff1ec;
      color: #b85c38;
      border-color: #b85c38;
      filter: none;
    }

    .clear-button {
      margin-top: 24px;
      background: #9b3a2c;
      color: #fffaf0;
      border-radius: 8px;
    }

    .clear-button:hover {
      background: #843126;
      filter: none;
    }

    @media (max-width: 500px) {
      body {
        padding: 0;
      }

      .app-card {
        max-width: none;
        min-height: 100vh;
        margin: 0;
        padding: 10px 12px;
        border-radius: 0;
        box-shadow: none;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 28px;
        padding: 16px 14px 12px 46px;
      }

      h1::before {
        left: 14px;
        font-size: 22px;
      }

      h1::after {
        bottom: -22px;
      }

      .tabs {
        margin-bottom: 20px;
      }

      .tab-button {
        padding: 12px 4px;
        font-size: 15px;
      }

      .totals {
        gap: 10px;
      }

      .total {
        padding: 14px;
        font-size: 20px;
      }

      .total-label {
        font-size: 13px;
      }

      .budget-input {
        align-items: flex-start;
        flex-direction: column;
      }

      .budget-input input {
        max-width: none;
      }

      .calendar-grid {
        gap: 2px;
        padding: 2px;
      }

      .day {
        min-height: 62px;
        padding: 4px;
      }

      .empty-day {
        min-height: 62px;
      }

      .weekday {
        font-size: 11px;
      }

      .day-number {
        font-size: 13px;
      }

      .day-badge {
        font-size: 9px;
        padding: 2px 3px;
      }

      .calendar-header h2 {
        font-size: 19px;
      }

      .calendar-nav {
        padding: 7px 10px;
        font-size: 16px;
      }

      .expense {
        padding-left: 8px;
        padding-right: 8px;
      }
    }
  </style>
</head>

<body>

  <div class="app-card">

    <h1>Rakshanda's Budget</h1>

    <nav class="tabs">
      <button class="tab-button active" data-tab="add-tab" type="button">Add</button>
      <button class="tab-button" data-tab="calendar-tab" type="button">Calendar</button>
      <button class="tab-button" data-tab="history-tab" type="button">History</button>
    </nav>

    <!-- ADD TAB -->
    <section id="add-tab" class="tab-content active">

      <div class="totals">
        <div class="total">
          <span class="total-label">All-time total</span>
          $<span id="total">0.00</span>
        </div>

        <div class="total">
          <span class="total-label">This month</span>
          $<span id="month-total">0.00</span>
        </div>
      </div>

      <div class="budget">
        <div class="budget-input">
          <label for="budget-input">Monthly budget</label>
          <input type="number" id="budget-input" placeholder="e.g. 2500" min="0">
        </div>

        <h2 id="add-budget-title">Budget for October 2026</h2>

        <div class="budget-line">
          Spent: $<span id="add-budget-spent">0.00</span>
        </div>

        <div class="budget-line">
          Budget: $<span id="add-budget-amount">0.00</span>
        </div>

        <div id="add-budget-left-line" class="budget-line budget-left under-budget">
          Left: $<span id="add-budget-left">0.00</span>
        </div>
      </div>

      <form id="expense-form">
        <input type="date" id="date">

        <input type="number" id="amount" placeholder="Amount">

        <select id="payment-method">
          <option>Cash</option>
          <option>Octopus</option>
          <option>Alipay</option>
          <option>Mastercard</option>
          <option>Visa</option>
          <option>Other</option>
        </select>

        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Fun</option>
          <option>Other</option>
        </select>

        <input type="text" id="note" placeholder="Note (optional)">

        <button type="submit">Add expense</button>

        <p id="error-message" class="error"></p>
      </form>

    </section>

    <!-- CALENDAR TAB -->
    <section id="calendar-tab" class="tab-content">

      <div class="calendar">
        <div class="calendar-header">
          <button id="previous-month" class="calendar-nav" type="button">◀</button>
          <h2 id="calendar-title"></h2>
          <button id="next-month" class="calendar-nav" type="button">▶</button>
        </div>

        <div class="calendar-grid" id="calendar"></div>
      </div>

      <div class="budget">
        <h2 id="calendar-budget-title">Budget for October 2026</h2>

        <div class="budget-line">
          Spent: $<span id="calendar-budget-spent">0.00</span>
        </div>

        <div class="budget-line">
          Budget: $<span id="calendar-budget-amount">0.00</span>
        </div>

        <div id="calendar-budget-left-line" class="budget-line budget-left under-budget">
          Left: $<span id="calendar-budget-left">0.00</span>
        </div>
      </div>

    </section>

    <!-- HISTORY TAB -->
    <section id="history-tab" class="tab-content">

      <div class="filter">

        <select id="month-filter">
          <option value="all">All months</option>
        </select>

        <select id="week-filter">
          <option value="all">All weeks</option>
          <option value="1">Week 1 (1–7)</option>
          <option value="2">Week 2 (8–14)</option>
          <option value="3">Week 3 (15–21)</option>
          <option value="4">Week 4 (22–28)</option>
          <option value="5">Week 5 (29–31)</option>
        </select>

        <select id="payment-filter">
          <option>All methods</option>
          <option>Cash</option>
          <option>Octopus</option>
          <option>Alipay</option>
          <option>Mastercard</option>
          <option>Visa</option>
          <option>Other</option>
        </select>

        <select id="category-filter">
          <option>All categories</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Fun</option>
          <option>Other</option>
        </select>

      </div>

      <h2>Summary by payment method</h2>
      <div id="summary" class="summary"></div>

      <h2>Expenses</h2>
      <div id="expense-list"></div>

      <button id="clear-all" class="clear-button">Clear all</button>

    </section>

  </div>

  <script>
    const STORAGE_KEY = "expenseTracker.v1";
    const BUDGET_KEY = "expenseTracker.budget";

    let savedExpenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    let expenses = savedExpenses.filter(expense => {
      return Number.isFinite(Number(expense.amount)) && Number(expense.amount) > 0;
    });

    let budget = Number(localStorage.getItem(BUDGET_KEY)) || 0;

    const form = document.getElementById("expense-form");
    const dateInput = document.getElementById("date");
    const amountInput = document.getElementById("amount");
    const paymentInput = document.getElementById("payment-method");
    const categoryInput = document.getElementById("category");
    const noteInput = document.getElementById("note");

    const monthFilter = document.getElementById("month-filter");
    const weekFilter = document.getElementById("week-filter");
    const paymentFilter = document.getElementById("payment-filter");
    const categoryFilter = document.getElementById("category-filter");

    const expenseList = document.getElementById("expense-list");
    const totalElement = document.getElementById("total");
    const monthTotalElement = document.getElementById("month-total");
    const errorMessage = document.getElementById("error-message");
    const summaryElement = document.getElementById("summary");
    const clearAllButton = document.getElementById("clear-all");
    const calendarElement = document.getElementById("calendar");
    const calendarTitle = document.getElementById("calendar-title");
    const previousMonthButton = document.getElementById("previous-month");
    const nextMonthButton = document.getElementById("next-month");
    const budgetInput = document.getElementById("budget-input");

    function getLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    dateInput.value = getLocalDate();
    budgetInput.value = budget || "";

    let calendarDate = new Date();
    calendarDate.setDate(1);

    function getMonthTitle(date) {
      return date.toLocaleString("en-US", {
        month: "long",
        year: "numeric"
      });
    }

    function getMonthSpent(year, month) {
      const monthString = String(month + 1).padStart(2, "0");

      return expenses
        .filter(expense => {
          return expense.date.startsWith(`${year}-${monthString}`);
        })
        .reduce((total, expense) => total + Number(expense.amount), 0);
    }

    function renderMonthFilter() {
      const currentSelection = monthFilter.value;

      const uniqueMonths = [...new Set(
        expenses
          .map(expense => expense.date.substring(0, 7))
          .filter(month => /^\d{4}-\d{2}$/.test(month))
      )];

      uniqueMonths.sort((a, b) => b.localeCompare(a));

      monthFilter.innerHTML = "";

      const allOption = document.createElement("option");
      allOption.value = "all";
      allOption.textContent = "All months";
      monthFilter.appendChild(allOption);

      uniqueMonths.forEach(month => {
        const option = document.createElement("option");
        option.value = month;

        const [year, monthNumber] = month.split("-");

        const displayDate = new Date(
          Number(year),
          Number(monthNumber) - 1,
          1
        );

        option.textContent = displayDate.toLocaleString("en-US", {
          month: "long",
          year: "numeric"
        });

        monthFilter.appendChild(option);
      });

      if (currentSelection !== "all" && uniqueMonths.includes(currentSelection)) {
        monthFilter.value = currentSelection;
      } else {
        monthFilter.value = "all";
      }
    }

    function renderBudget() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      const title = getMonthTitle(calendarDate);
      const spent = getMonthSpent(year, month);
      const difference = budget - spent;

      const budgetData = [
        {
          title: document.getElementById("add-budget-title"),
          spent: document.getElementById("add-budget-spent"),
          amount: document.getElementById("add-budget-amount"),
          leftLine: document.getElementById("add-budget-left-line")
        },
        {
          title: document.getElementById("calendar-budget-title"),
          spent: document.getElementById("calendar-budget-spent"),
          amount: document.getElementById("calendar-budget-amount"),
          leftLine: document.getElementById("calendar-budget-left-line")
        }
      ];

      budgetData.forEach(section => {
        section.title.textContent = `Budget for ${title}`;
        section.spent.textContent = spent.toFixed(2);
        section.amount.textContent = budget.toFixed(2);

        if (difference >= 0) {
          section.leftLine.className =
            "budget-line budget-left under-budget";
          section.leftLine.innerHTML =
            `Left: $${difference.toFixed(2)}`;
        } else {
          section.leftLine.className =
            "budget-line budget-left over-budget";
          section.leftLine.innerHTML =
            `Over by $${Math.abs(difference).toFixed(2)}`;
        }
      });
    }

    function renderCalendar() {
      calendarElement.innerHTML = "";

      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();

      calendarTitle.textContent = getMonthTitle(calendarDate);

      const weekdays = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      weekdays.forEach(day => {
        const weekdayElement = document.createElement("div");
        weekdayElement.className = "weekday";
        weekdayElement.textContent = day;
        calendarElement.appendChild(weekdayElement);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const firstDayOffset = (firstDay + 6) % 7;

      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayOffset; i++) {
        const emptyDay = document.createElement("div");
        emptyDay.className = "empty-day";
        calendarElement.appendChild(emptyDay);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dayElement = document.createElement("div");
        dayElement.className = "day";

        const dayNumber = document.createElement("div");
        dayNumber.className = "day-number";
        dayNumber.textContent = day;

        dayElement.appendChild(dayNumber);

        const date = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

        const dayTotal = expenses
          .filter(expense => expense.date === date)
          .reduce((total, expense) => total + Number(expense.amount), 0);

        if (dayTotal > 0) {
          const badge = document.createElement("div");
          badge.className = "day-badge";

          if (dayTotal > 100) {
            badge.classList.add("high");
          }

          badge.textContent = `$${dayTotal.toFixed(2)}`;
          dayElement.appendChild(badge);
        }

        calendarElement.appendChild(dayElement);
      }
    }

    previousMonthButton.addEventListener("click", function() {
      calendarDate.setMonth(calendarDate.getMonth() - 1);
      renderCalendar();
      renderBudget();
    });

    nextMonthButton.addEventListener("click", function() {
      calendarDate.setMonth(calendarDate.getMonth() + 1);
      renderCalendar();
      renderBudget();
    });

    function renderExpenses() {
      expenseList.innerHTML = "";

      let total = 0;
      let monthTotal = 0;
      const paymentTotals = {};

      const today = new Date();
      const currentYear = today.getFullYear();
      const currentMonth = String(today.getMonth() + 1).padStart(2, "0");

      const selectedMonth = monthFilter.value;
      const selectedWeek = weekFilter.value;
      const selectedPayment = paymentFilter.value;
      const selectedCategory = categoryFilter.value;

      expenses.forEach(expense => {
        const amount = Number(expense.amount);

        total += amount;

        if (expense.date.startsWith(`${currentYear}-${currentMonth}`)) {
          monthTotal += amount;
        }

        if (!paymentTotals[expense.paymentMethod]) {
          paymentTotals[expense.paymentMethod] = 0;
        }

        paymentTotals[expense.paymentMethod] += amount;
      });

      const sortedPayments = Object.entries(paymentTotals)
        .sort((a, b) => b[1] - a[1]);

      if (sortedPayments.length === 0) {
        summaryElement.innerHTML = "<p>No expenses yet</p>";
      } else {
        summaryElement.innerHTML = "";

        sortedPayments.forEach(([method, amount]) => {
          const summaryItem = document.createElement("div");
          summaryItem.className = "summary-item";

          summaryItem.innerHTML = `
            <span>${method}</span>
            <strong>$${amount.toFixed(2)}</strong>
          `;

          summaryElement.appendChild(summaryItem);
        });
      }

      const filteredExpenses = expenses.filter(expense => {
        const monthMatches =
          selectedMonth === "all" ||
          expense.date.startsWith(selectedMonth);

        const day = Number(expense.date.substring(8, 10));

        let weekMatches = true;

        if (selectedWeek !== "all") {
          const weekNumber = Number(selectedWeek);

          if (weekNumber === 1) {
            weekMatches = day >= 1 && day <= 7;
          } else if (weekNumber === 2) {
            weekMatches = day >= 8 && day <= 14;
          } else if (weekNumber === 3) {
            weekMatches = day >= 15 && day <= 21;
          } else if (weekNumber === 4) {
            weekMatches = day >= 22 && day <= 28;
          } else if (weekNumber === 5) {
            weekMatches = day >= 29 && day <= 31;
          }
        }

        const paymentMatches =
          selectedPayment === "All methods" ||
          expense.paymentMethod === selectedPayment;

        const categoryMatches =
          selectedCategory === "All categories" ||
          expense.category === selectedCategory;

        return (
          monthMatches &&
          weekMatches &&
          paymentMatches &&
          categoryMatches
        );
      });

      filteredExpenses.forEach(expense => {
        const expenseElement = document.createElement("div");
        expenseElement.className = "expense";

        const expenseInfo = document.createElement("div");
        expenseInfo.className = "expense-info";

        expenseInfo.innerHTML = `
          <div class="expense-amount">
            $${Number(expense.amount).toFixed(2)}
          </div>
          <div class="expense-details">
            ${expense.date} · ${expense.paymentMethod} · ${expense.category}
            ${expense.note ? ` · ${expense.note}` : ""}
          </div>
        `;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "✕";
        deleteButton.setAttribute("aria-label", "Delete expense");

        deleteButton.addEventListener("click", function() {
          const confirmed = confirm("Delete this expense?");

          if (confirmed) {
            const expenseIndex = expenses.indexOf(expense);

            if (expenseIndex !== -1) {
              expenses.splice(expenseIndex, 1);

              localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(expenses)
              );

              renderMonthFilter();
              renderExpenses();
            }
          }
        });

        expenseElement.appendChild(expenseInfo);
        expenseElement.appendChild(deleteButton);
        expenseList.appendChild(expenseElement);
      });

      totalElement.textContent = total.toFixed(2);
      monthTotalElement.textContent = monthTotal.toFixed(2);

      renderCalendar();
      renderBudget();
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const amount = Number(amountInput.value);

      if (
        !amountInput.value ||
        !Number.isFinite(amount) ||
        amount <= 0
      ) {
        errorMessage.textContent =
          "Please enter an amount greater than 0";
        return;
      }

      const expense = {
        amount: amountInput.value,
        paymentMethod: paymentInput.value,
        category: categoryInput.value,
        note: noteInput.value,
        date: dateInput.value
      };

      expenses.unshift(expense);

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(expenses)
      );

      form.reset();

      dateInput.value = getLocalDate();
      errorMessage.textContent = "";

      renderMonthFilter();
      renderExpenses();
    });

    monthFilter.addEventListener("change", renderExpenses);
    weekFilter.addEventListener("change", renderExpenses);
    paymentFilter.addEventListener("change", renderExpenses);
    categoryFilter.addEventListener("change", renderExpenses);

    budgetInput.addEventListener("input", function() {
      const value = Number(budgetInput.value);

      if (
        budgetInput.value === "" ||
        !Number.isFinite(value) ||
        value < 0
      ) {
        budget = 0;
      } else {
        budget = value;
      }

      localStorage.setItem(BUDGET_KEY, budget);
      renderBudget();
    });

    clearAllButton.addEventListener("click", function() {
      const confirmed = confirm(
        "Are you sure you want to clear all expenses?"
      );

      if (confirmed) {
        expenses = [];
        localStorage.removeItem(STORAGE_KEY);

        renderMonthFilter();
        renderExpenses();
      }
    });

    document.querySelectorAll(".tab-button").forEach(button => {
      button.addEventListener("click", function() {
        const tabId = button.dataset.tab;

        document.querySelectorAll(".tab-button").forEach(tabButton => {
          tabButton.classList.remove("active");
        });

        document.querySelectorAll(".tab-content").forEach(tab => {
          tab.classList.remove("active");
        });

        button.classList.add("active");
        document.getElementById(tabId).classList.add("active");
      });
    });

    renderMonthFilter();
    renderExpenses();
  </script>

</body>
</html>
